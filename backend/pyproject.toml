[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations folder) would otherwise make ruff treat the package as first-party
known-third-party = ["alembic"]
