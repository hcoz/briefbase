name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: briefbase
          POSTGRES_PASSWORD: briefbase
          POSTGRES_DB: briefbase_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U briefbase -d briefbase_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Throwaway CI-only values; nothing here is a real secret.
      DATABASE_URL: postgresql+psycopg://briefbase:briefbase@localhost:5432/briefbase_test
      TEST_DATABASE_URL: postgresql+psycopg://briefbase:briefbase@localhost:5432/briefbase_test
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Apply migrations to an empty database
        run: alembic upgrade head
      - name: Check models and migrations are in sync
        run: alembic check
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
