# Setup (once): brew install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  # Block committed secrets (API keys, JWT secrets, passwords)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Python lint + format (config in backend/pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend lint (needs `npm ci` in frontend/ first). Lints the whole app
  # from frontend/ so the local eslint.config.mjs is picked up.
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx --no-install eslint --max-warnings=0'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false

  # Basic hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
